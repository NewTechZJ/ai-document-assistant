# ------------ Chat: Ollama (free, local) ------------
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
# Spring AI 2.0 names (the old ...ollama.chat.options.* names are deprecated for removal)
# First run: ollama pull llama3.2:3b
spring.ai.ollama.chat.model=llama3.2:3b
# num-predict: maximum tokens the model may generate per reply (caps latency, mirrors the Bedrock max-tokens=500)
spring.ai.ollama.chat.num-predict=500

# ------------ Embeddings: Ollama nomic-embed-text (768-dim) ------------
# First run: ollama pull nomic-embed-text
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=nomic-embed-text
app.embedding.dimensions=768
# nomic-embed-text is trained with these task prefixes; Titan needs none
app.embedding.document-prefix=search_document:
app.embedding.query-prefix=search_query:

# ------------ Retrieval (nomic cosine scale is higher than Titan's). Calibrate from "topScore" in the logs.
app.ask.min-score=0.45
