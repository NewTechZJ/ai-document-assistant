# ------------ Bedrock connection (shared by chat + embeddings)
spring.ai.bedrock.aws.region=us-east-1
spring.ai.bedrock.aws.profile.name=demo-ai-docassist

# ------------ Chat: Claude Haiku 4.5 via Bedrock Converse
spring.ai.model.chat=bedrock-converse
# Spring AI 2.0 names (the old ...converse.chat.options.* names are deprecated for removal)
spring.ai.bedrock.converse.chat.model=us.anthropic.claude-haiku-4-5-20251001-v1:0
# Cost cap: the model may generate at most 500 tokens per reply
spring.ai.bedrock.converse.chat.max-tokens=500

# ------------ Embeddings: Titan Text Embeddings V2 (InvokeModel)
spring.ai.model.embedding=bedrock-titan
spring.ai.bedrock.titan.embedding.model=amazon.titan-embed-text-v2:0
# Default is IMAGE (for titan-embed-image-v1); must be TEXT here
spring.ai.bedrock.titan.embedding.input-type=text
# Spring AI 2.0.1 sends only {"inputText": ...}; Titan V2 then uses its defaults dimensions=1024, normalize=true.
# EmbeddingService rejects any vector that isn't 1024-dim.
app.embedding.dimensions=1024

# ------------ Retrieval (Titan V2 cosine scale). Calibrate from "topScore" in the logs.
app.ask.min-score=0.20

# ------------ Swagger: disabled in aws, enabled by default in local
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false