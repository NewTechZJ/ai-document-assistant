spring.application.name=ai-document-assistant
spring.profiles.default=local
spring.ai.model.embedding=none
spring.mvc.problemdetails.enabled=true

# Upload limits. Spring's default is 1MB, too small for real PDFs.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Chat : system prompt sent with every /api/chat call. Tune here without recompiling.
app.chat.system-prompt=You are the assistant inside an AI Document Assistant app. Answer clearly and briefly.

# Chunking : defaults live in ChunkingProperties (1800 / 270 / 200). Uncomment a line only to override it.
#app.chunking.target-chars=1800
#app.chunking.overlap-chars=270
#app.chunking.min-chars=200

# Actuator : only /actuator/health is exposed over HTTP; details hidden from callers.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.pdf.max-concurrent=2