spring.application.name=ai-document-assistant
spring.profiles.default=local

# No embedding model unless a profile enables one (local: ollama, aws: bedrock-titan). Never both.
# Each profile file must override this, otherwise embeddings are unavailable.
spring.ai.model.embedding=none
spring.mvc.problemdetails.enabled=true

# Upload limits. Spring's default is 1MB, too small for real PDFs.
# The request limit is slightly higher than the file limit to leave room for multipart headers.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Chat: system prompt sent with every /api/chat call. Tune here without recompiling.
app.chat.system-prompt=You are the assistant inside an AI Document Assistant app. Answer clearly and briefly.

# Chunking: defaults live in ChunkingProperties (1800 / 270 / 200). Uncomment a line only to override it.
#app.chunking.target-chars=1800
#app.chunking.overlap-chars=270
#app.chunking.min-chars=200

# Actuator: only /actuator/health is exposed over HTTP; details hidden from callers.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# PDF limits: defaults live in PdfLimits (500 pages / 2,000,000 chars / 60s). Uncomment to override.
#app.pdf.max-pages=100
#app.pdf.max-extraction-time=60s
# Matches app.ingest.max-chunks below (500 chunks x ~1,800 chars), which is the effective limit.
app.pdf.max-text-chars=900000
# Maximum PDFs processed at the same time; extra requests get 503 (ServerBusy).
app.pdf.max-concurrent=2

# Ingestion cost guard: Titan has no batch API, so every chunk is one Bedrock call. 500 chunks ~ 900k chars.
app.ingest.max-chunks=500

# Embedding: number of chunks embedded per group.
app.embedding.batch-size=16

# Ask: chunks retrieved per question. min-score and max-tokens are set per profile
# (min-score depends on the embedding model).
app.ask.top-k=5
app.ask.snippet-chars=200
